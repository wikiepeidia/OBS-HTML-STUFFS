<!DOCTYPE html>
<!--
    GPTCLOCK1 — OBS Overlay  |  Clock + default public-safe weather/location
    ────────────────────────────────────────────────────────────────────────
    Mode summary:
        - default: fixed public-safe address + weather for that fixed spot
        - server : optional local proxy for higher-accuracy/manual travel mode

    Regular browser file previews may still hit CORS limits.
    OBS Browser Source is the target runtime.
-->
<html lang="vi">

<head>
    <meta charset="UTF-8" />
    <title>Đồng hồ OBS – Hà Nội</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap');

        *,
        *::before,
        *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --card-bg: rgba(255, 255, 255, 0.94);
            --card-border: rgba(2, 132, 199, 0.22);
            --card-highlight: rgba(255, 255, 255, 0.95);
            --card-shadow: 0 10px 30px rgba(15, 23, 42, 0.14), 0 2px 8px rgba(2, 132, 199, 0.08);
            --text-primary: #0f172a;
            --text-secondary: #334155;
            --text-subtle: #475569;
            --accent: #0369a1;
            --accent-strong: #0284c7;
            --badge-bg: rgba(2, 132, 199, 0.11);
            --badge-border: rgba(2, 132, 199, 0.22);
            --divider: linear-gradient(90deg, transparent, rgba(2, 132, 199, 0.28), transparent);
            --wx-bg: rgba(240, 249, 255, 0.88);
            --wx-border: rgba(2, 132, 199, 0.20);
            --wx-divider: rgba(2, 132, 199, 0.14);
            --icon-color: #0284c7;
            --time-shadow: 0 1px 0 rgba(255, 255, 255, 0.7);
            --dot-live: #16a34a;
            --dot-static: #0284c7;
            --dot-loading: #d97706;
            --dot-error: #dc2626;
        }

        body.night {
            --card-bg: rgba(11, 16, 30, 0.94);
            --card-border: rgba(125, 211, 252, 0.22);
            --card-highlight: rgba(255, 255, 255, 0.08);
            --card-shadow: 0 12px 34px rgba(2, 6, 23, 0.58), 0 0 24px rgba(56, 189, 248, 0.12);
            --text-primary: #f1f5f9;
            --text-secondary: #cbd5e1;
            --text-subtle: #9eb4cc;
            --accent: #7dd3fc;
            --accent-strong: #38bdf8;
            --badge-bg: rgba(56, 189, 248, 0.14);
            --badge-border: rgba(125, 211, 252, 0.26);
            --divider: linear-gradient(90deg, transparent, rgba(125, 211, 252, 0.28), transparent);
            --wx-bg: rgba(30, 41, 66, 0.56);
            --wx-border: rgba(125, 211, 252, 0.20);
            --wx-divider: rgba(148, 163, 184, 0.18);
            --icon-color: #7dd3fc;
            --time-shadow: 0 0 18px rgba(56, 189, 248, 0.14);
            --dot-live: #4ade80;
            --dot-static: #38bdf8;
            --dot-loading: #fbbf24;
            --dot-error: #f87171;
        }

        body {
            background: transparent;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Be Vietnam Pro', 'Segoe UI', system-ui, sans-serif;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            text-rendering: geometricPrecision;
        }

        /* ════ CARD ════ */
        .card {
            width: 320px;
            padding: 16px 20px 16px;
            border-radius: 20px;
            text-align: center;
            background: var(--card-bg);
            border: 1.5px solid var(--card-border);
            box-shadow: var(--card-shadow), inset 0 1px 0 var(--card-highlight);
            color: var(--text-primary);
            transition: background .6s ease, color .6s ease, border-color .6s ease, box-shadow .6s ease;
        }

        .acc {
            color: var(--accent);
        }

        .mute {
            color: var(--text-secondary);
        }

        /* ════ LOCATION ROW ════ */
        .loc-row {
            margin-bottom: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 2px;
            width: 100%;
        }

        .loc-head {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 7px;
            max-width: 100%;
        }

        .loc-line-1 {
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            max-width: 100%;
            display: block;
            font-size: 0.78rem;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            font-weight: 700;
            line-height: 1.3;
        }

        .loc-line-2 {
            max-width: 100%;
            text-align: center;
            font-size: 0.74rem;
            font-weight: 500;
            letter-spacing: 0.02em;
            line-height: 1.25;
            color: var(--text-subtle);
        }

        /* live-status dot */
        .dot {
            flex-shrink: 0;
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: var(--dot-live);
            box-shadow: 0 0 0 3px rgba(74, 222, 128, 0.18);
            animation: pulse 2.2s ease-in-out infinite;
        }

        .dot.loading {
            background: var(--dot-loading);
            box-shadow: 0 0 0 3px rgba(251, 191, 36, 0.18);
            animation: none;
        }

        .dot.error {
            background: var(--dot-error);
            box-shadow: 0 0 0 3px rgba(248, 113, 113, 0.2);
            animation: none;
        }

        .dot.static {
            background: var(--dot-static);
            box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.18);
            animation: none;
        }

        @keyframes pulse {

            0%,
            100% {
                opacity: 1;
            }

            50% {
                opacity: 0.45;
            }
        }

        /* ════ TIME ════ */
        .time-big {
            font-size: 2.95rem;
            font-weight: 800;
            letter-spacing: 0.03em;
            line-height: 1.02;
            font-variant-numeric: tabular-nums;
            text-shadow: var(--time-shadow);
        }

        .time-sub {
            margin-top: 6px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .time-vi {
            font-size: 0.88rem;
            font-weight: 600;
        }

        .period {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            font-size: 0.7rem;
            font-weight: 700;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            padding: 2px 8px;
            border-radius: 999px;
            background: var(--badge-bg);
            border: 1px solid var(--badge-border);
            color: var(--accent);
        }

        .colon {
            display: inline-block;
            margin: 0 1px;
            animation: blink 1s ease-in-out infinite;
        }

        @keyframes blink {

            0%,
            100% {
                opacity: 0.95;
            }

            50% {
                opacity: 0.28;
            }
        }

        /* ════ DIVIDER ════ */
        hr {
            border: none;
            height: 1px;
            background: var(--divider);
            margin: 11px 0 10px;
        }

        /* ════ DATE ════ */
        .date-row {
            font-size: 0.82rem;
            font-weight: 600;
            color: var(--text-primary);
            letter-spacing: 0.01em;
        }

        .badge {
            display: inline-block;
            font-size: 0.69rem;
            font-weight: 700;
            padding: 2px 10px;
            border-radius: 999px;
            margin-top: 5px;
            letter-spacing: 0.05em;
            background: var(--badge-bg);
            border: 1px solid var(--badge-border);
            color: var(--accent);
        }

        /* ════ WEATHER BOX ════ */
        .wx-box {
            border-radius: 14px;
            padding: 11px 12px 10px;
            margin-top: 12px;
            background: var(--wx-bg);
            border: 1px solid var(--wx-border);
        }

        .wx-top {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 11px;
        }

        .wx-emoji {
            font-size: 1.95rem;
            line-height: 1;
        }

        .wx-temp {
            font-size: 1.72rem;
            font-weight: 800;
            line-height: 1;
            font-variant-numeric: tabular-nums;
            color: var(--text-primary);
        }

        .wx-unit {
            font-size: 0.98rem;
            font-weight: 700;
            color: var(--accent);
            margin-left: 1px;
        }

        .wx-right {
            text-align: left;
        }

        .wx-desc {
            font-size: 0.8rem;
            font-weight: 600;
            color: var(--text-secondary);
            text-transform: capitalize;
            margin-top: 2px;
        }

        .wx-meta {
            font-size: 0.74rem;
            font-weight: 600;
            color: var(--text-secondary);
            font-variant-numeric: tabular-nums;
            margin-top: 8px;
            display: flex;
            gap: 10px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .wx-stat {
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }

        .wx-stat svg {
            width: 13px;
            height: 13px;
            stroke: var(--icon-color);
            fill: none;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
            flex-shrink: 0;
        }

        .wx-note {
            font-size: 0.74rem;
            font-weight: 500;
            color: var(--text-subtle);
        }

        .wx-ts {
            font-size: 0.7rem;
            font-weight: 500;
            color: var(--text-subtle);
            font-variant-numeric: tabular-nums;
            letter-spacing: 0.015em;
            margin-top: 8px;
            padding-top: 7px;
            border-top: 1px solid var(--wx-divider);
        }
    </style>
</head>

<body class="day">
    <div class="card">

        <!-- Location -->
        <div class="loc-row acc">
            <div class="loc-head">
                <span id="loc-dot" class="dot loading"></span>
                <span id="loc-line-1" class="loc-line-1">Đang xác định vị trí…</span>
            </div>
            <div id="loc-line-2" class="loc-line-2 mute" hidden></div>
        </div>

        <!-- Time -->
        <div class="time-big" id="time">00<span class="colon">:</span>00<span class="colon">:</span>00</div>
        <div class="time-sub">
            <span class="time-vi acc" id="time-vi"></span>
            <span class="period" id="period"></span>
        </div>

        <hr />

        <!-- Date -->
        <div class="date-row" id="date"></div>
        <div class="badge" id="badge"></div>

        <!-- Weather -->
        <div class="wx-box" id="wx-box">
            <div class="wx-note">Đang tải thời tiết…</div>
        </div>

    </div>

    <script>
        /* ── CONFIG ─────────────────────────────────────────────────── */
        const SERVER_URL = 'http://127.0.0.1:8787/api/context';
        const SERVER_HEALTH_URL = 'http://127.0.0.1:8787/health';
        const OWM_KEY = '';
        const DEFAULT_PROFILE = {
            label: 'Phường Hoàn Kiếm, Thành phố Hà Nội',
            lat: 21.0285,
            lon: 105.8542,
            source: 'Mặc định OBS',
        };
        /* ─────────────────────────────────────────────────────────── */

        const REFRESH_MS = 15 * 60 * 1000;
        const SERVER_PROBE_MS = 60 * 1000;
        let currentMode = 'default';
        let lastRefreshAt = 0;

        /* ── Vietnamese lookup ──────────────────────────────────────── */
        const VI_WD = ['Chủ Nhật', 'Thứ Hai', 'Thứ Ba', 'Thứ Tư', 'Thứ Năm', 'Thứ Sáu', 'Thứ Bảy'];
        const VI_MON = ['tháng 1', 'tháng 2', 'tháng 3', 'tháng 4', 'tháng 5', 'tháng 6',
            'tháng 7', 'tháng 8', 'tháng 9', 'tháng 10', 'tháng 11', 'tháng 12'];

        function getPeriod(h) {
            if (h >= 5 && h < 12) return { suf: 'sáng', label: '🌅 Sáng', night: false };
            if (h >= 12 && h < 14) return { suf: 'trưa', label: '☀️ Trưa', night: false };
            if (h >= 14 && h < 18) return { suf: 'chiều', label: '🌤️ Chiều', night: false };
            if (h >= 18 && h < 21) return { suf: 'tối', label: '🌆 Tối', night: true };
            return { suf: 'đêm', label: '🌙 Đêm', night: true };
        }

        function pad(n) { return String(n).padStart(2, '0'); }

        function wxEmoji(id, night) {
            if (id >= 200 && id < 300) return '⛈️';
            if (id >= 300 && id < 400) return '🌦️';
            if (id >= 500 && id < 600) return id >= 511 ? '🌨️' : '🌧️';
            if (id >= 600 && id < 700) return '❄️';
            if (id >= 700 && id < 800) return '🌫️';
            if (id === 800) return night ? '🌕' : '☀️';
            if (id === 801) return night ? '🌙' : '🌤️';
            if (id === 802) return '⛅';
            return '☁️';
        }

        function splitLocationLabel(label) {
            const parts = String(label || '').split(',').map(part => part.trim()).filter(Boolean);
            if (!parts.length) return ['Đang xác định vị trí…', ''];
            if (parts.length === 1) return [parts[0], ''];
            return [parts[0], parts.slice(1).join(', ')];
        }

        function setLocation(label, modeClass) {
            const dot = document.getElementById('loc-dot');
            const line1 = document.getElementById('loc-line-1');
            const line2 = document.getElementById('loc-line-2');
            const [primary, secondary] = splitLocationLabel(label);
            line1.textContent = primary;
            line2.textContent = secondary;
            line2.hidden = !secondary;
            dot.className = `dot ${modeClass}`.trim();
        }

        function renderWeatherCard(payload) {
            const box = document.getElementById('wx-box');
            const night = getPeriod(new Date().getHours()).night;
            const emoji = wxEmoji(payload.conditionId, night);
            const temp = Math.round(payload.tempC);
            const feelsLike = Math.round(payload.feelsLikeC);
            const humidity = Math.round(payload.humidity);
            const wind = Number(payload.windMps).toFixed(1);
            const meta = payload.meta || '';

            box.innerHTML = `
          <div class="wx-top">
            <span class="wx-emoji" aria-hidden="true">${emoji}</span>
            <div class="wx-right">
              <div class="wx-temp">${temp}<span class="wx-unit">°C</span></div>
              <div class="wx-desc">${payload.description}</div>
            </div>
          </div>
          <div class="wx-meta">
            <span class="wx-stat" title="Độ ẩm">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.69l5.66 5.66a8 8 0 1 1-11.31 0z"/></svg>
              ${humidity}%
            </span>
            <span class="wx-stat" title="Tốc độ gió">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9.59 4.59A2 2 0 1 1 11 8H2m10.59 11.41A2 2 0 1 0 14 16H2m15.73-8.27A2.5 2.5 0 1 1 19.5 12H2"/></svg>
              ${wind} m/s
            </span>
            <span class="wx-stat" title="Cảm giác như">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14 14.76V3.5a2.5 2.5 0 0 0-5 0v11.26a4.5 4.5 0 1 0 5 0z"/></svg>
              ${feelsLike}°C
            </span>
          </div>
          <div class="wx-ts">${meta}</div>`;
        }

        function renderWeatherError(error) {
            const message = error instanceof Error ? error.message : String(error || 'Không rõ lỗi');
            document.getElementById('wx-box').innerHTML = `<div class="wx-note" style="opacity:1;color:#ef5350;font-style:normal">
                  ❌ <b>Lỗi thời tiết:</b> ${message}<br>
                  <span style="font-size:.63rem;opacity:.8">
                    ${message.includes('401') ? 'API key sai hoặc chưa kích hoạt' :
                    message.includes('Failed to fetch') ? 'OBS/trình duyệt không truy cập được API hoặc proxy' :
                        'Kiểm tra kết nối mạng hoặc server cục bộ'}
                  </span>
                </div>`;
        }

        function wmoToOwm(code) {
            if (code === 0) return { id: 800, description: 'trời quang' };
            if (code === 1) return { id: 801, description: 'ít mây' };
            if (code === 2) return { id: 802, description: 'mây rải rác' };
            if (code === 3) return { id: 804, description: 'nhiều mây' };
            if (code === 45 || code === 48) return { id: 741, description: 'sương mù' };
            if (code >= 51 && code <= 57) return { id: 300, description: 'mưa phùn' };
            if (code >= 61 && code <= 67) return { id: 500, description: 'mưa' };
            if (code >= 71 && code <= 77) return { id: 600, description: 'tuyết rơi' };
            if (code >= 80 && code <= 82) return { id: 521, description: 'mưa rào' };
            if (code >= 85 && code <= 86) return { id: 621, description: 'mưa tuyết' };
            if (code >= 95) return { id: 200, description: 'dông' };
            return { id: 803, description: 'có mây' };
        }

        async function fetchOpenMeteo(lat, lon) {
            const url = `https://api.open-meteo.com/v1/forecast`
                + `?latitude=${lat}&longitude=${lon}`
                + `&current=temperature_2m,relative_humidity_2m,apparent_temperature,weather_code,wind_speed_10m`
                + `&wind_speed_unit=ms`;
            const r = await fetch(url);
            if (!r.ok) throw new Error(`Open-Meteo HTTP ${r.status}`);
            const data = await r.json();
            const cur = data.current || {};
            const wmo = wmoToOwm(cur.weather_code);
            return {
                conditionId: wmo.id,
                tempC: cur.temperature_2m,
                feelsLikeC: cur.apparent_temperature,
                description: wmo.description,
                humidity: cur.relative_humidity_2m,
                windMps: cur.wind_speed_10m,
            };
        }

        async function fetchWeather(lat, lon) {
            const key = (OWM_KEY || new URLSearchParams(location.search).get('owm_key') || localStorage.getItem('owm_key') || '').trim();
            if (key) {
                try {
                    const url = `https://api.openweathermap.org/data/2.5/weather`
                        + `?lat=${lat}&lon=${lon}&appid=${encodeURIComponent(key)}`
                        + `&units=metric&lang=vi`;
                    const r = await fetch(url);
                    if (r.ok) {
                        const w = await r.json();
                        return {
                            conditionId: w.weather[0].id,
                            tempC: w.main.temp,
                            feelsLikeC: w.main.feels_like,
                            description: w.weather[0].description,
                            humidity: w.main.humidity,
                            windMps: w.wind.speed,
                        };
                    }
                } catch { /* fallback to keyless Open-Meteo */ }
            }
            return fetchOpenMeteo(lat, lon);
        }

        async function fetchServerContext() {
            const r = await fetch(SERVER_URL);
            if (!r.ok) {
                let detail = '';
                try { const j = await r.json(); detail = j.error || ''; } catch { }
                throw new Error(`Proxy ${r.status}${detail ? ': ' + detail : ''}`);
            }
            return r.json();
        }

        async function detectMode() {
            try {
                const r = await fetch(SERVER_HEALTH_URL, { cache: 'no-store' });
                if (!r.ok) return 'default';
                const payload = await r.json();
                return payload && payload.ok ? 'server' : 'default';
            } catch {
                return 'default';
            }
        }

        async function updateDefaultMode() {
            setLocation(DEFAULT_PROFILE.label, 'static');
            document.getElementById('wx-box').innerHTML = `<div class="wx-note">Đang tải thời tiết cho địa chỉ mặc định…</div>`;

            const weather = await fetchWeather(DEFAULT_PROFILE.lat, DEFAULT_PROFILE.lon);
            const now = new Date();
            renderWeatherCard({
                conditionId: weather.conditionId,
                tempC: weather.tempC,
                feelsLikeC: weather.feelsLikeC,
                description: weather.description,
                humidity: weather.humidity,
                windMps: weather.windMps,
                meta: `Cập nhật lúc ${pad(now.getHours())}:${pad(now.getMinutes())} · ${DEFAULT_PROFILE.source}`,
            });
        }

        async function updateServerMode() {
            setLocation('Đang lấy vị trí từ server…', 'loading');
            document.getElementById('wx-box').innerHTML = `<div class="wx-note">Đang tải dữ liệu từ server…</div>`;

            const payload = await fetchServerContext();
            setLocation(payload.location.label, '');
            renderWeatherCard({
                conditionId: payload.weather.condition_id,
                tempC: payload.weather.temp_c,
                feelsLikeC: payload.weather.feels_like_c,
                description: payload.weather.description,
                humidity: payload.weather.humidity,
                windMps: payload.weather.wind_mps,
                meta: `Cập nhật lúc ${payload.updated_hhmm} · ${payload.mode_label}`,
            });
        }

        async function refreshData() {
            try {
                if (currentMode === 'server') {
                    await updateServerMode();
                    lastRefreshAt = Date.now();
                    return;
                }
                await updateDefaultMode();
                lastRefreshAt = Date.now();
            } catch (err) {
                if (currentMode === 'server') {
                    setLocation(DEFAULT_PROFILE.label, 'error');
                }
                renderWeatherError(err);
                console.error('[overlay:data]', err);
            }
        }

        async function syncMode(forceRefresh = false) {
            const nextMode = await detectMode();
            const changed = nextMode !== currentMode;
            currentMode = nextMode;

            if (changed || forceRefresh || Date.now() - lastRefreshAt >= REFRESH_MS) {
                await refreshData();
            }
        }

        function tick() {
            const now = new Date();
            const h = now.getHours();
            const m = now.getMinutes();
            const s = now.getSeconds();
            const p = getPeriod(h);

            const themeParam = new URLSearchParams(location.search).get('theme');
            document.body.className = (themeParam === 'day' || themeParam === 'night')
                ? themeParam
                : (p.night ? 'night' : 'day');

            document.getElementById('time').innerHTML =
                pad(h) + '<span class="colon">:</span>' +
                pad(m) + '<span class="colon">:</span>' + pad(s);

            const h12 = h % 12 || 12;
            document.getElementById('time-vi').textContent = h12 + ' giờ ' + p.suf;
            document.getElementById('period').textContent = p.label;

            const wd = VI_WD[now.getDay()];
            document.getElementById('date').textContent =
                wd + ', ngày ' + now.getDate() + ' ' + VI_MON[now.getMonth()] + ' năm ' + now.getFullYear();
            document.getElementById('badge').textContent = wd;
        }

        tick();
        syncMode(true);
        setInterval(tick, 1000);
        setInterval(() => { syncMode(false); }, SERVER_PROBE_MS);
    </script>
</body>

</html>
